name: Windows Nuitka Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag matching wlre.__version__ (e.g. v0.4.20)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check version tag
        run: python -m tools.build.release_nuitka --tag "$env:RELEASE_TAG" --check-tag
      - name: Install test dependencies
        run: python -m pip install -r requirements-ui.txt
      - name: Run tests
        run: python -m unittest discover -s tests -q
      # Call the BAT's Python entry point directly to avoid its interactive pause.
      - name: Compile and self-test Windows EXE
        run: python -m tools.build.build_nuitka --mode standalone --compiler msvc
      - name: Package and verify ZIP
        run: python -m tools.build.release_nuitka --tag "$env:RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist_nuitka/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-diagnostics
          path: |
            dist_nuitka/standalone/build.log
            dist_nuitka/standalone/compilation-report.xml
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Verify checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag --generate-notes
          --title "WLRE LaLa $RELEASE_TAG"
          release/*.zip release/SHA256SUMS.txt
