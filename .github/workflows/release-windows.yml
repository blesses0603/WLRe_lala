name: Windows and macOS Nuitka Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing NEW tag matching wlre.__version__, e.g. v0.5.0 (not Ver.0.5.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check tag format, existence and previous release
        id: tag
        shell: bash
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must use vX.Y.Z (for example v0.5.0), not Ver.X.Y.Z. Enter an existing tag."
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REQUESTED_TAG" >/dev/null; then
            echo "::error::Tag $REQUESTED_TAG does not exist. Commit the matching application version, create the tag and push it first."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$REQUESTED_TAG" >/dev/null 2>&1; then
            echo "::error::Release $REQUESTED_TAG already exists. Use a new version tag containing the latest build scripts."
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      PYTHONUTF8: '1'
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', needs.preflight.outputs.tag) }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-ui.txt
            requirements-build.txt
            requirements-build-macos.txt
      - name: Check version tag
        run: python -m tools.build.release_nuitka --tag "$env:RELEASE_TAG" --check-tag
      - name: Install test dependencies
        run: python -m pip install -r requirements-ui.txt
      - name: Run tests
        run: python -m unittest discover -s tests -q
      # Match the PR cache namespace; never reuse objects across architectures.
      - name: Restore Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: desktop-nuitka-v1-windows-x64-py312-${{ hashFiles('requirements-build.txt', 'requirements-build-macos.txt', 'requirements-ui.txt') }}-${{ github.sha }}
          restore-keys: |
            desktop-nuitka-v1-windows-x64-py312-${{ hashFiles('requirements-build.txt', 'requirements-build-macos.txt', 'requirements-ui.txt') }}-
            desktop-nuitka-v1-windows-x64-py312-
      # Call the BAT's Python entry point directly to avoid its interactive pause.
      - name: Compile and self-test Windows EXE
        run: python -m tools.build.build_nuitka --mode standalone --compiler msvc
      - name: Package and verify ZIP
        run: python -m tools.build.release_nuitka --tag "$env:RELEASE_TAG"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-release
          path: dist_nuitka/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nuitka-diagnostics
          path: |
            dist_nuitka/standalone/build.log
            dist_nuitka/standalone/compilation-report.xml
          if-no-files-found: ignore
          retention-days: 14

  build_macos:
    needs: preflight
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      BUILD_ARCH: ${{ matrix.arch }}
      PYTHONUTF8: '1'
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      # Intel hosted runner may lack a functional WindowServer; still self-test
      # the built APP and require Mach-O/signature validation.
      WLRE_NATIVE_GUI_SMOKE: ${{ matrix.arch == 'x64' && '0' || '1' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', needs.preflight.outputs.tag) }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements-ui.txt
            requirements-build.txt
            requirements-build-macos.txt
      - name: Restore Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: desktop-nuitka-v1-macos-${{ matrix.arch }}-py312-${{ hashFiles('requirements-build.txt', 'requirements-build-macos.txt', 'requirements-ui.txt') }}-${{ github.sha }}
          restore-keys: |
            desktop-nuitka-v1-macos-${{ matrix.arch }}-py312-${{ hashFiles('requirements-build.txt', 'requirements-build-macos.txt', 'requirements-ui.txt') }}-
            desktop-nuitka-v1-macos-${{ matrix.arch }}-py312-
      - name: Check version tag and native architecture
        run: |
          python -m tools.build.release_nuitka --tag "$RELEASE_TAG" --check-tag
          python -c 'import os; from tools.build.build_macos import native_arch; assert native_arch() == os.environ["BUILD_ARCH"]'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build-macos.txt
      - name: Run tests and native GUI smoke test
        run: |
          python -m unittest discover -s tests -q
          if [[ "$BUILD_ARCH" != "x64" ]]; then
            python WLRE_Client.py --smoke-test-gui
          else
            echo 'Intel hosted CI GUI smoke unavailable; manual Mac test required.'
          fi
      - name: Compile, self-test and verify app signature
        run: python -m tools.build.build_macos --arch "$BUILD_ARCH"
      - name: Package and verify app ZIP
        run: python -m tools.build.release_macos --tag "$RELEASE_TAG" --arch "$BUILD_ARCH"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-${{ matrix.arch }}-release
          path: dist_nuitka/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve macOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-${{ matrix.arch }}-diagnostics
          path: |
            dist_nuitka/macos_${{ matrix.arch }}/build.log
            dist_nuitka/macos_${{ matrix.arch }}/compilation-report.xml
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [preflight, build, build_macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release
      - name: Verify and combine platform checksums
        working-directory: release
        run: |
          for manifest in SHA256SUMS*.txt; do
            sha256sum --check "$manifest"
          done
          cat SHA256SUMS_macos_*.txt >> SHA256SUMS.txt
          rm SHA256SUMS_macos_*.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag --generate-notes
          --title "WLRe_LaLa $RELEASE_TAG"
          release/*.zip release/SHA256SUMS.txt
