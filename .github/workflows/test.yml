name: Main and PR tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Verify all supported desktop platforms on every PR and main push.
        os: [ubuntu-latest, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      # GUI regression may create temporary LOCALAPPDATA roots; never fetch
      # official Bundles from test sessions. Auto-service has offline fixtures.
      WLRE_DISABLE_AUTO_CATALOG: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare Linux display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth python3-tk
      - name: Install UI and bundled extractor dependencies
        run: python -m pip install -r requirements-ui.txt -r requirements-extractor.txt
      - name: Validate Python syntax and repository integrity
        run: |
          python -m compileall -q wlre tools tests WLRE_Client.py
          python -m tools.audit_repository --strict-git
      - name: Linux tests and GUI smoke test
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m unittest discover -s tests -v
          xvfb-run -a python WLRE_Client.py --smoke-test-gui
      - name: Windows tests and GUI smoke test
        if: runner.os == 'Windows'
        run: |
          python -m unittest discover -s tests -v
          python WLRE_Client.py --smoke-test-gui
      - name: macOS tests and native GUI smoke test
        if: runner.os == 'macOS'
        run: |
          python -c 'import platform, tkinter; print("macOS:", platform.mac_ver()[0], "arch:", platform.machine(), "Tk:", tkinter.TkVersion)'
          # 真實模組入口支援 spawn；每個 case／類別交接有 90 秒診斷截止。
          python -m tools.run_native_unittest --pattern test_compact_crafting.py
          python -m tools.run_native_unittest
          python WLRE_Client.py --smoke-test-gui
      - name: Validate packaged resources and build plan
        run: |
          python WLRE_Client.py --self-test
          # Source-runtime check: native Nuitka build tests additionally run this in compiled EXE/APP.
          python WLRE_Client.py --self-test-unityfs
          python -m tools.build.build_nuitka --dry-run
          python -m tools.build.build_macos --arch arm64 --dry-run > /dev/null
          python -m tools.build.build_macos --arch x64 --dry-run > /dev/null
