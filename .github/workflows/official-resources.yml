name: Official resource module tests

on:
  push:
    branches: [feature/lala-core-rebuild, feature/lala-core-rebuild-resources]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-resources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resources:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install static checker
        run: python -m pip install ruff==0.17.2
      - name: Check formal resource parser and observation interfaces
        run: >-
          python -m ruff check wlre/resources_runtime
          tests/test_official_resource_versions.py tests/test_resource_downloader.py
          tests/test_official_resource_manager.py tests/test_official_scene_references.py tools/check_official_resource_snapshot.py
          wlre/services/world/unity_textasset.py
      - name: Test source identity and parser with synthetic fixtures only
        run: |
          python -m unittest discover -s tests -p test_official_resource_versions.py -v
          python -m unittest discover -s tests -p test_yooasset_manifest_full_index.py -v
          python -m unittest discover -s tests -p test_official_version.py -v
          python -m unittest discover -s tests -p test_official_manifest_sync.py -v
          python -m unittest discover -s tests -p test_official_bundle_download.py -v
          python -m unittest discover -s tests -p test_official_incremental_sync.py -v
          python -m unittest discover -s tests -p test_official_lua_index.py -v
          python -m unittest discover -s tests -p test_resource_downloader.py -v
          python -m unittest discover -s tests -p test_official_resource_manager.py -v
          python -m unittest discover -s tests -p test_official_scene_references.py -v
          python -m unittest discover -s tests -p test_unity_textasset.py -v
          python -m unittest discover -s tests -p test_instance_protocol.py -v

# 常規工作不下載正式 Manifest／Bundle，也不取代既有完整 PR 三平台檢查。
