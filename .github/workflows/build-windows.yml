name: Version tag and Windows EXE build
run-name: Windows EXE - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - wlre/__init__.py
      - .github/workflows/build-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: false

env:
  WLRE_DISABLE_AUTO_CATALOG: '1'
  PYTHONUTF8: '1'
  NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache

jobs:
  version-tag:
    if: github.ref == 'refs/heads/main'
    name: Create version tag for the exact main commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.tag.outputs.source_sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Create tag without overwriting an existing version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'from wlre import __version__; print(__version__)')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Invalid application version'
            exit 1
          fi
          tag="v$version"
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already points to another object; refusing to overwrite it"
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Created or verified $tag at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  windows-exe:
    needs: version-tag
    name: Test, compile and archive Windows x64
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version-tag.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-ui.txt
            requirements-build.txt
            requirements-build-macos.txt
            requirements-extractor.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ui.txt -r requirements-extractor.txt
      - name: Validate source and bundled database
        run: |
          python -m compileall -q wlre tools tests WLRE_Client.py
          python -m tools.audit_repository --strict-git
          python WLRE_Client.py --self-test
          python WLRE_Client.py --self-test-unityfs
      - name: Run full regression suite
        run: python -m unittest discover -s tests -q
      - name: Restore Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: desktop-nuitka-v1-windows-x64-py312-${{ hashFiles('requirements-build.txt', 'requirements-build-macos.txt', 'requirements-ui.txt', 'requirements-extractor.txt') }}-${{ github.sha }}
          restore-keys: |
            desktop-nuitka-v1-windows-x64-py312-${{ hashFiles('requirements-build.txt', 'requirements-build-macos.txt', 'requirements-ui.txt', 'requirements-extractor.txt') }}-
            desktop-nuitka-v1-windows-x64-py312-
      - name: Compile and self-test Windows EXE
        run: python -m tools.build.build_nuitka --mode standalone --compiler msvc
      - name: Package and verify Windows ZIP
        shell: pwsh
        run: |
          $version = python -c "from wlre import __version__; print(__version__)"
          python -m tools.build.release_nuitka --tag "v$version"
      - name: Upload Windows EXE package and checksums
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-exe-${{ github.sha }}
          path: dist_nuitka/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-exe-diagnostics-${{ github.sha }}
          path: |
            dist_nuitka/standalone/build.log
            dist_nuitka/standalone/compilation-report.xml
          if-no-files-found: ignore
          retention-days: 14
