name: .NET migration verification
on:
  pull_request:
    paths: ['dotnet/**', 'tools/check_terminal_acceptance.py', 'tools/check_desktop_icon.py', '.github/workflows/dotnet-migration.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test common core
        run: dotnet test dotnet/Lala.Core.Tests/Lala.Core.Tests.csproj -c Release
      - name: Test Android connection lifecycle without a device
        run: dotnet test dotnet/Lala.Android.Lifecycle.Tests/Lala.Android.Lifecycle.Tests.csproj -c Release
      - name: Check public Core consumer contract
        run: dotnet run --project dotnet/Lala.Core.PublicContract.Check/Lala.Core.PublicContract.Check.csproj -c Release
      - name: Check bounded cloud acceptance harness offline
        run: dotnet run --project dotnet/Lala.Cloud.Acceptance/Lala.Cloud.Acceptance.csproj -c Release -- --self-test
      - name: Check synthetic terminal acceptance with Linux PTYs
        if: runner.os == 'Linux'
        run: python3 tools/check_terminal_acceptance.py
      - name: Build Avalonia desktop
        run: dotnet build dotnet/Lala.Desktop/Lala.Desktop.csproj -c Release
      - name: Verify Windows executable icon
        if: runner.os == 'Windows'
        run: |
          dotnet publish dotnet/Lala.Desktop/Lala.Desktop.csproj -c Release -r win-x64 --self-contained false -o desktop-icon-check
          python tools/check_desktop_icon.py desktop-icon-check/Lala.Desktop.exe
      - name: Check offline inspector
        run: dotnet run --project dotnet/Lala.Desktop/Lala.Desktop.csproj -c Release --no-build -- --self-test
      - name: Test Avalonia UI and synthetic loopback login
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a dotnet run --project dotnet/Lala.Desktop/Lala.Desktop.csproj -c Release --no-build -- --ui-self-test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build Avalonia Android
        run: dotnet build dotnet/Lala.Android/Lala.Android.csproj -c Debug -p:EmbedAssembliesIntoApk=true
      - name: Preserve Android validation APK
        uses: actions/upload-artifact@v4
        with:
          name: lala-android-lifecycle-debug
          path: dotnet/Lala.Android/bin/Debug/net10.0-android36.0/*-Signed.apk
          if-no-files-found: error
          retention-days: 7
