name: LaLa desktop PR regression (no release)
on:
  pull_request:
    branches: [main]
    paths:
      - 'wlre/**'
      - 'tools/**'
      - 'tests/**'
      - 'WLRE_Client.py'
      - 'requirements-*.txt'
      - '.github/workflows/desktop-pr-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-pr-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WLRE_DISABLE_AUTO_CATALOG: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ui.txt
            requirements-extractor.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ui.txt -r requirements-extractor.txt
      - name: Validate Python source
        run: python -m compileall -q wlre tools tests WLRE_Client.py
      - name: Run regression suite
        run: python -m unittest discover -s tests -q
