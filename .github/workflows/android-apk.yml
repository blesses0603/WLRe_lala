name: Android v0.0.1 Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: github.ref == 'refs/heads/android-development'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake \
            libffi-dev libssl-dev libsqlite3-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev libltdl-dev git zip unzip
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer>=1.5,<2" "cython<3"
      - name: Check Python syntax before packaging
        run: python -m compileall -q main.py android_app wlre
      - name: Build Android debug APK
        run: buildozer -v android debug
      - name: Upload APK (only after successful build)
        uses: actions/upload-artifact@v4
        with:
          name: WLRE-LaLa-Android-v0.0.1-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
