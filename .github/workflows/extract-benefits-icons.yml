name: Extract verified benefits icons
on:
  push:
    branches: [fix/sailing-map-portals]
    paths: [.github/workflows/extract-benefits-icons.yml]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ui.txt -r requirements-extractor.txt
      - name: Extract exact named sprites from verified official bundle
        env:
          WLRE_DISABLE_AUTO_CATALOG: '1'
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, tempfile
          from urllib.request import urlopen
          import UnityPy
          from wlre.services.official_manifest_sync import ManifestSpec, fetch_official_manifest
          from wlre.services.official_bundle_download import spec_from_manifest, fetch_bundle
          root='https://wlreftp.chinesegamer.net/WLN/TW/1.3.22/ResourcesPC/AssetBundle/'
          with urlopen(root+'MainPackage.version',timeout=30) as response:
              version=response.read(128).decode('utf-8-sig').strip()
          with tempfile.TemporaryDirectory() as cache:
              manifest=fetch_official_manifest(ManifestSpec('1.3.22','MainPackage',version),cache_root=cache)
              spec=spec_from_manifest(data_ver='1.3.22',package='MainPackage',index=manifest.index,name='mainpackage_atlas.bundle')
              path=fetch_bundle(spec,cache_root=cache,timeout=60)
              env=UnityPy.load(str(path))
              targets={'MainIcon_023':(59,57),'Btn_CategoryLoginAward002':(60,60)}
              found={}
              for obj in env.objects:
                  if obj.type.name!='Sprite':continue
                  sprite=obj.read()
                  name=sprite.m_Name
                  if name not in targets:continue
                  if name in found:raise ValueError('Duplicate sprite '+name)
                  image=sprite.image
                  if image.size!=targets[name]:raise ValueError('Unexpected sprite size '+name+str(image.size))
                  out=io.BytesIO();image.save(out,format='PNG')
                  found[name]=out.getvalue()
              if set(found)!=set(targets):raise ValueError('Missing exact sprites '+str(set(targets)-set(found)))
              print('ICON_PROVENANCE '+json.dumps({'version':version,'bundle':spec.name,'bundle_sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'manifest_sha256':hashlib.sha256(manifest.cache_path.read_bytes()).hexdigest(),'bundle_md5':spec.file_hash,'bundle_crc':spec.file_crc}))
              for name,body in found.items():
                  print('ICON_BASE64 '+name+' '+base64.b64encode(body).decode())
                  print('ICON_SHA256 '+name+' '+hashlib.sha256(body).hexdigest())
          PY
